# Owns: checking every push and pull request from the sources of this repository – the desktop app's typecheck per
# layer, its import boundaries and its unit tests on Linux; real RTC on Linux and real TCP binds on Windows.
# Never: uses a secret, writes to the repository, builds or publishes a release package.
name: Build from source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # 30 was enough until the runners' Ubuntu mirror slowed down (24.11.2026: playwright's --with-deps took 22 min for its
    # fonts; three runs in a row were cancelled at 30 min just before or in Real RTC).
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run check # typecheck, boundaries and the unit tests

      - name: Install RTC test browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Real RTC (Node, Chromium and WebKit)
        run: npm run test:real-rtc

  native-tcp-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          package-manager-cache: false
      - run: npm ci --no-fund --no-audit
      - name: Restart sign-in unit tests (no real login)
        run: node --test test/unit/computer/signin.test.ts
      - name: Secure mode Windows desktop gate (no real lock screen)
        run: node --test test/isolated/windows-secure-desktop.test.mjs
      - name: One bubble per person on a real named pipe (several companies, quit and crash takeover)
        run: node --test test/unit/main/bubble-owner.test.ts
      - name: Windows installer-helper and Markdown path fixtures
        run: node --test test/unit/main/install-helper.test.ts test/unit/media/absolute-paths.test.ts
      - name: Real Windows shell jobs (background child on exit; reap on timeout, cancel, EOF)
        env:
          AUTARK_SHELL_JOB_TEST: '1'
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File resources/broker/build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/unit/tools/shell-job.test.ts test/unit/tools/shell-windows.test.ts
      - name: Real TCP port and company binds
        run: npm run test:native-tcp
