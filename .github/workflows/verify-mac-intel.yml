# Owns: native Intel (x86_64) acceptance of the universal Mac ZIP of an existing release: it starts the unchanged app
# and lets the packaged runtime answer the demo chat, with the same check as the Apple Silicon run in release-from-compiled.
# Never: builds packages, publishes or changes releases, uploads artifacts, uses real profiles or disables the sandbox.
# 27.11.2026 (Felix): rebuilt for today's OpenAutark tree. The old feed-repo version expected a compiled payload without
# src/ and refused every tag of this repository (run 45965118284, v0.3.21). It now checks out the tag's apps/desktop for
# the pinned check dependencies, takes the check script from this workflow's commit and only reads the release.
name: Verify an existing universal Mac package on Intel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release or draft tag (vX.Y.Z)
        type: string
        required: true
      sha256:
        description: SHA256 of autark-mac-universal.zip in that release
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_MAC_SHA256: ${{ inputs.sha256 }}

jobs:
  verify-mac-intel:
    if: github.repository == 'teydra/OpenAutark' # B-085: not in forks
    runs-on: macos-15-intel
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Download and verify the universal Mac ZIP of the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a vX.Y.Z tag' }
          if ($env:RELEASE_MAC_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Use a SHA256 digest' }
          $arch = node -p 'process.arch'; $machine = uname -m
          Write-Host "Runner architecture: node=$arch uname=$machine"
          if ($arch -ne 'x64' -or $machine -ne 'x86_64') { throw 'This acceptance requires a native Intel runner' }
          if ((Get-Content package.json -Raw | ConvertFrom-Json).version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Package and tag versions differ' }
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern autark-mac-universal.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Release download failed' }
          $zip = Join-Path $env:RUNNER_TEMP 'autark-mac-universal.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:RELEASE_MAC_SHA256.ToLowerInvariant()) { throw "Mac ZIP integrity mismatch: $hash" }
          Write-Host "Mac ZIP SHA256 verified: $hash ($((Get-Item -LiteralPath $zip).Length) bytes)"
      - name: Add the release CI check script (release tooling, not product source)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/release-ci/native-release-check.cjs?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' > scripts/native-release-check.cjs && test -s scripts/native-release-check.cjs
      - name: Install the pinned checking dependencies
        run: npm ci --no-fund --no-audit
      - name: Rebuild app/ from the tag, so the check compares every built file with the shipped archive
        run: npm run build
      - name: Open the unchanged universal bundle on Intel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mac-universal
          ditto -x -k "$RUNNER_TEMP/autark-mac-universal.zip" dist/mac-universal
          codesign --verify --deep --strict 'dist/mac-universal/Autark.app'
          lipo -archs 'dist/mac-universal/Autark.app/Contents/MacOS/Autark'
          node scripts/native-release-check.cjs
      - name: Confirm the evidence describes the requested Intel package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Get-Content -LiteralPath test-results/native-darwin.json -Raw | ConvertFrom-Json
          if ($evidence.platform -cne 'darwin' -or $evidence.architecture -cne 'x64' -or $evidence.version -cne $env:RELEASE_TAG.Substring(1)) { throw 'The native evidence does not describe the requested Intel package' }
          if (-not $evidence.packagedRuntime.demoChat) { throw 'The packaged runtime did not answer the demo chat' }
          Write-Host "Intel acceptance: version=$($evidence.version) arch=$($evidence.architecture) demoChatReplyMs=$($evidence.packagedRuntime.demoChatReplyMs) macZipSha256=$($env:RELEASE_MAC_SHA256.ToLowerInvariant())"
      - name: Show isolated test diagnostics after a failure
        if: failure()
        shell: bash
        run: cat test-results/native-*-failure.json 2>/dev/null || true
