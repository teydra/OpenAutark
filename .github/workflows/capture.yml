name: dotnetpro 1920x1080 capture
on:
  push:
    branches: [ci/dotnetpro-capture-0318]
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'teydra/OpenAutark'
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Public installer, local model, 1920x1080 Remote Desktop session
        shell: pwsh
        run: ./host.ps1
      - name: Encrypt captures before transfer
        if: always()
        shell: pwsh
        run: ./seal-captures.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: encrypted-dotnetpro-evidence
          path: ${{ runner.temp }}/dotnetpro-screenshots.p7m
          if-no-files-found: ignore
          retention-days: 3
